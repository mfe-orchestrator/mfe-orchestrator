# See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Single entry for the whole pnpm workspace: the lockfile lives at the root,
  # so this also covers frontend, backend and e2e.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Keep the noise down: routine bumps land as one PR per area.
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      sentry:
        patterns:
          - "@sentry/*"
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "@commitlint/*"
          - "eslint*"
          - "typescript-eslint"
          - "turbo"
          - "lefthook"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
