name: 🚀 Deploy to Server

permissions:
  contents: read
  packages: read

on:
  workflow_call:
  push:
    branches: [development]

    
jobs:
  docker-build:
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit

  deploy:
    needs: [docker-build]
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 Deploy to DEV
      uses: appleboy/ssh-action@v1.2.5
      # The infrastructure configuration takes these as required variables; the infrastructure
      # repository passes them the same way. Without them `tofu apply` stops asking for a value.
      # drone-ssh upper-cases every name in `envs`, so the values travel under upper-case names
      # and the script maps them onto the lower-case TF_VAR_ names OpenTofu looks for.
      env:
        NOSQL_DATABASE_URL_PROD: ${{ secrets.NOSQL_DATABASE_URL_PROD }}
        NOSQL_DATABASE_URL_DEV: ${{ secrets.NOSQL_DATABASE_URL_DEV }}
        AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: NOSQL_DATABASE_URL_PROD,NOSQL_DATABASE_URL_DEV,AZURE_FOUNDRY_API_KEY
        script: |
          export TF_VAR_nosql_database_url_prod="$NOSQL_DATABASE_URL_PROD"
          export TF_VAR_nosql_database_url_dev="$NOSQL_DATABASE_URL_DEV"
          export TF_VAR_azure_foundry_api_key="$AZURE_FOUNDRY_API_KEY"
          cd ${{ secrets.TERRAFORM_PATH }}
          tofu init
          tofu apply -auto-approve
