# Lefthook configuration
# See: https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  parallel: true
  commands:
    lint-and-format:
      glob: "{backend,frontend,e2e}/**/*.{js,ts,tsx,json}"
      run: "pnpm exec biome check --write --staged --no-errors-on-unmatched {staged_files}"
      stage_fixed: true

    typecheck-backend:
      root: "backend/"
      glob: "**/*.{ts,tsx}"
      # The script checks the build and the tests, which live in two tsconfigs
      run: "pnpm run typecheck"

    typecheck-frontend:
      root: "frontend/"
      glob: "**/*.{ts,tsx}"
      # tsconfig.json only references the app and the node configs: tsc on it checks nothing
      run: "pnpm run typecheck"

commit-msg:
  commands:
    commitlint:
      run: "pnpm exec commitlint --edit"
