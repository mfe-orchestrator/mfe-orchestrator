name: 🚀 Build and deploy

on:
  push:
    tags:
      - '*'

  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
        description: 'Version to release'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7

    # pnpm comes from the packageManager field of package.json
    - name: 🔄 Setup pnpm
      uses: pnpm/action-setup@v6

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: '**/pnpm-lock.yaml'

    - name: 🔧 Install Dependencies
      run: pnpm install --frozen-lockfile

    # The single-spa root config reads these at build time (see .env.example). Set them as
    # repository variables: VITE_MFE_PROJECT_ID is required, the backend url
    # defaults to this console, VITE_MFE_ENVIRONMENT is optional (left empty, the
    # backend resolves the environment from the domain the host is served on).
    - name: 🏗️ Build
      run: pnpm build
      env:
        VITE_MFE_BACKEND_URL: ${{ vars.VITE_MFE_BACKEND_URL || '%domain%/api' }}
        VITE_MFE_PROJECT_ID: ${{ vars.VITE_MFE_PROJECT_ID }}
        VITE_MFE_ENVIRONMENT: ${{ vars.VITE_MFE_ENVIRONMENT }}

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: 🔑 Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    # The Dockerfile serves dist/ with nginx, non-root, on port 8080
    - name: 🚢 Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
