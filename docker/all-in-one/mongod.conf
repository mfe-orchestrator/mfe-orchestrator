# MongoDB configuration of the all-in-one image.
#
# The database is only used by the backend that lives in the same container, so
# it is bound to the loopback interface: even when the container publishes its
# ports, MongoDB is not reachable from the outside and there is no password to
# rotate. `--replSet` is appended by start-mongod.sh when MONGO_REPLICA_SET is
# set, because a single node replica set is what enables transactions.

storage:
    dbPath: /data/db

net:
    bindIp: 127.0.0.1
    port: 27017

# No systemLog.destination on purpose: mongod then logs on stdout and its logs
# end up in `docker logs` through supervisor.
