; Process supervision of the all-in-one image.
;
; Four services live in the container: MongoDB, Redis, the backend and Nginx.
; Supervisor starts them, restarts them when they crash and forwards every log
; to stdout/stderr so that `docker logs` shows the whole picture. When a service
; gives up for good, the quit-on-fatal listener takes the container down with it
; instead of leaving a half working installation up.

[supervisord]
nodaemon=true
user=root
loglevel=info
pidfile=/run/supervisord.pid
; The interesting logs are the ones of the programs, already piped to stdout.
logfile=/dev/null
logfile_maxbytes=0

; Exposed so that `docker exec <container> supervisorctl status` works.
[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; The stdout of an event listener is the channel it talks to supervisor on, so
; only its stderr can be logged.
[eventlistener:quit-on-fatal]
command=/usr/local/bin/quit-on-fatal.py
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mongod]
command=/usr/local/bin/start-mongod.sh
user=mongodb
priority=10
autorestart=true
startsecs=5
startretries=3
; Let mongod flush and close its files cleanly.
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=/usr/local/bin/start-redis.sh
user=redis
priority=10
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; start-backend.sh waits for MongoDB and Redis before starting the backend, so
; the startup order is enforced there and not by the priority alone.
[program:backend]
command=/usr/local/bin/start-backend.sh
user=mfe
directory=/var/www/backend
; Children inherit the environment of supervisor, which runs as root: without
; this, mongosh would try to write its log inside /root and fail.
environment=HOME="/home/mfe",USER="mfe"
priority=20
autorestart=true
startsecs=10
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autorestart=true
startsecs=5
startretries=3
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
