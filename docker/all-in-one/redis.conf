# Redis configuration of the all-in-one image.
#
# Like MongoDB, Redis is only consumed by the backend of the same container and
# is therefore bound to the loopback interface. A password is added by
# start-redis.sh when REDIS_PASSWORD is set.

bind 127.0.0.1
port 6379
protected-mode yes

# Supervisor is the process manager: Redis must stay in the foreground.
daemonize no
supervised no

dir /data/redis

# The cache also holds data that is expensive to rebuild, so it is persisted in
# the /data volume with the append only file.
appendonly yes
appendfsync everysec
save 900 1

loglevel notice
# Empty logfile means stdout, so the logs flow into `docker logs`.
logfile ""
